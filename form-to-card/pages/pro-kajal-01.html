<!DOCTYPE html>
<html lang="en-IN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PAGE USER -->
    <meta name="profile-id" content="pro-kajal-01">
    <meta name="profile-name" content="Kajal">
    <title>Connect with Me | Kajal</title>

    <link rel="stylesheet" href="/assets/css/style.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
            padding: 30px 15px;
        }

        .connect-box {
            max-width: 550px;
            margin: 40px auto;
            background: #fff;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #ddd;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #111;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: .9;
        }
    </style>
</head>

<body>

    <div class="connect-box">

        <h1>Connect with Me</h1>

        <form id="connectForm">

            <div class="form-group">
                <label for="subject">Subject</label>

                <input type="text" id="subject" name="subject" placeholder="Enter subject" required>
            </div>

            <div class="form-group">
                <label for="message">Message</label>

                <textarea id="message" name="message" placeholder="Write your message..." required></textarea>
            </div>

            <button type="submit">
                Submit
            </button>

        </form>

    </div>



    <script src="/assets/js/api/user-card.js"></script>


</body>

</html>
